default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  username: <%= ENV.fetch("DB_USERNAME", "lagom") %>
  password: <%= ENV.fetch("DB_PASSWORD", "lagom") %>
  port: <%= ENV.fetch("DB_PORT", 5434) %>

development:
  <<: *default
  database: lagom_development

test:
  <<: *default
  database: lagom_test

staging:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
